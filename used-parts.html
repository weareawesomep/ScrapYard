<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Spare Parts | ScrapCar.ae</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
   <script>
// CHANGE THIS URL FOR USED PARTS OR NEW PARTS
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOZ5sGD1yMuSaFWNpHHAdRUdndQyeTOD6-xBuKq-A3wmEim82bPT5mcCfcyJPnLMz0PWgbO_VX1P-S/pub?gid=1947635296&single=true&output=csv';
const WA_MSG = encodeURIComponent("Hi, I found your shop on ScrapCar.ae! I am looking for a spare part...");
const ITEMS_PER_PAGE = 12;

let allListings = [], filteredListings = [];
let activeFilters = { brand: [], model: [], condition: [], location: [] };
let brandCounts = {}, modelCounts = {}, dynamicLocations = [];
let currentPage = 1;

function parseCSV(text) { let p='', row=[''], ret=[row], i=0, r=0, s=true, l; for (l of text) { if ('"'===l) { if (s && l===p) row[i]+=l; s=!s; } else if (','===l && s) l=row[++i]=''; else if ('\n'===l && s) { if ('\r'===p) row[i]=row[i].slice(0,-1); row=ret[++r]=[l='']; i=0; } else row[i]+=l; p=l; } return ret; }

fetch(CSV_URL + '&t=' + Date.now()).then(r => r.text()).then(data => {
    const rows = parseCSV(data); allListings = rows.slice(1).filter(r => r.length > 3 && r[0] && r[0].trim());
    const lSet = new Set();
    allListings.forEach(row => {
        (row[1]||'').replace(/"/g,'').split(',').map(b=>b.trim()).filter(Boolean).forEach(b => brandCounts[b] = (brandCounts[b] || 0) + 1);
        (row[2]||'').replace(/"/g,'').split(',').map(m=>m.trim()).filter(Boolean).forEach(m => modelCounts[m] = (modelCounts[m] || 0) + 1);
        if (row[4] && row[4].trim()) lSet.add(row[4].trim());
    });
    dynamicLocations = [...lSet].sort(); buildSidebars(); applyFilters();
}).catch(() => { document.getElementById('listings-container').innerHTML = '<div class="state"><div class="state-title">Couldn\'t load listings</div></div>'; });

function buildSidebarHTML(brandQuery = '', modelQuery = '') {
    const condOpts = [{val:'used',label:'Used'}, {val:'new',label:'New'}, {val:'both',label:'Both'}];
    const sortedBrands = Object.entries(brandCounts).sort((a, b) => b[1] - a[1]).filter(b => b[0].toLowerCase().includes(brandQuery.toLowerCase()));
    const brandHTML = sortedBrands.map(([b, count]) => { const val = b.toLowerCase(); const checked = activeFilters.brand.includes(val) ? 'checked' : ''; return `<label class="filter-label"><input type="checkbox" class="filter-cb" value="${val}" ${checked} onchange="onCheck('brand','${val}',this.checked)">${b}<span class="filter-count">${count}</span></label>`; }).join('');
    
    const sortedModels = Object.entries(modelCounts).sort((a, b) => b[1] - a[1]).filter(m => m[0].toLowerCase().includes(modelQuery.toLowerCase()));
    const modelHTML = sortedModels.map(([m, count]) => { const val = m.toLowerCase(); const checked = activeFilters.model.includes(val) ? 'checked' : ''; return `<label class="filter-label"><input type="checkbox" class="filter-cb" value="${val}" ${checked} onchange="onCheck('model','${val}',this.checked)">${m}</label>`; }).join('');
    
    const condHTML = condOpts.map(o => `<label class="filter-label"><input type="checkbox" class="filter-cb" value="${o.val}" ${activeFilters.condition.includes(o.val)?'checked':''} onchange="onCheck('condition','${o.val}',this.checked)">${o.label}</label>`).join('');
    const locHTML = dynamicLocations.map(l => `<label class="filter-label"><input type="checkbox" class="filter-cb" value="${l.toLowerCase()}" ${activeFilters.location.includes(l.toLowerCase())?'checked':''} onchange="onCheck('location','${l.toLowerCase()}',this.checked)">${l}</label>`).join('');

    return `
        <div class="filter-section"><div class="filter-title">Car Brand</div><input type="text" id="sideBrandSearch" class="sidebar-search" placeholder="Search brands..." value="${brandQuery}" onkeyup="filterSidebar('brand', this.value)"><div class="filter-scroll">${brandHTML || '<div style="font-size:12px; color:rgba(255,255,255,0.4);">No brands found</div>'}</div></div>
        ${Object.keys(modelCounts).length ? `<div class="filter-section"><div class="filter-title">Car Model</div><input type="text" id="sideModelSearch" class="sidebar-search" placeholder="Search models..." value="${modelQuery}" onkeyup="filterSidebar('model', this.value)"><div class="filter-scroll">${modelHTML || '<div style="font-size:12px; color:rgba(255,255,255,0.4);">No models found</div>'}</div></div>` : ''}
        <div class="filter-section"><div class="filter-title">Condition</div>${condHTML}</div>
        <div class="filter-section"><div class="filter-title">Location</div><div class="filter-scroll">${locHTML}</div></div>
        <button class="clear-btn" onclick="clearFilters()">Clear All Filters</button>
    `;
}

function buildSidebars(bQuery = '', mQuery = '') { const html = buildSidebarHTML(bQuery, mQuery); document.getElementById('sidebar-desktop').innerHTML = html; document.getElementById('sidebar-mobile').innerHTML = html; if(bQuery) document.getElementById('sideBrandSearch')?.focus(); if(mQuery) document.getElementById('sideModelSearch')?.focus(); }
function filterSidebar(type, val) { if (type === 'brand') buildSidebars(val, document.getElementById('sideModelSearch')?.value || ''); if (type === 'model') buildSidebars(document.getElementById('sideBrandSearch')?.value || '', val); }
function onCheck(k, v, c) { if (c) { if (!activeFilters[k].includes(v)) activeFilters[k].push(v); } else { activeFilters[k] = activeFilters[k].filter(x => x !== v); } currentPage = 1; buildSidebars(); applyFilters(); }
function clearFilters() { activeFilters = { brand:[], model:[], condition:[], location:[] }; document.getElementById('searchInput').value = ''; currentPage = 1; buildSidebars(); applyFilters(); }
function removePill(k, v) { activeFilters[k] = activeFilters[k].filter(x=>x!==v); currentPage = 1; buildSidebars(); applyFilters(); }

function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim(); const { brand, model, condition, location } = activeFilters;
    filteredListings = allListings.filter(row => {
        const name = (row[0]||'').toLowerCase(), brands = (row[1]||'').toLowerCase(), models = (row[2]||'').toLowerCase(), cond = (row[3]||'').toLowerCase(), loc = (row[4]||'').toLowerCase();
        if (q && !name.includes(q) && !brands.includes(q) && !models.includes(q)) return false;
        if (brand.length && !brand.some(b => brands.includes(b))) return false;
        if (model.length && !model.some(m => models.includes(m))) return false;
        if (condition.length && !condition.some(c => c === 'both' ? cond === 'both' : (cond.includes(c) || cond === 'both'))) return false;
        if (location.length && !location.some(l => loc.includes(l))) return false; return true;
    });
    document.getElementById('resultsNum').textContent = filteredListings.length;
    document.getElementById('activePills').innerHTML = Object.entries(activeFilters).flatMap(([k, vals]) => vals.map(v => `<span class="pill" onclick="removePill('${k}','${v}')">${v} ×</span>`)).join('');
    renderListings();
}

function changePage(page) { currentPage = page; renderListings(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function waIconSVG(size) { return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="white"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.665.592 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"/></svg>`; }
function condTagClass(c) { const l = c.toLowerCase(); return l==='new' ? 'tag-new' : l==='both' ? 'tag-both' : 'tag-used'; }

function renderListings() {
    const c = document.getElementById('listings-container');
    if (!filteredListings.length) { c.innerHTML = '<div class="state"><div class="state-icon">🔍</div><div class="state-title">No shops found</div></div>'; return; }
    
    const totalPages = Math.ceil(filteredListings.length / ITEMS_PER_PAGE);
    const paginatedData = filteredListings.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

    let html = paginatedData.map((row, idx) => {
        const shopName=(row[0]||'').trim().replace(/[<>]/g,''), brandsRaw=(row[1]||'').trim(), modelsRaw=(row[2]||'').trim(), condition=(row[3]||'').trim().replace(/[<>"]/g,''), location=(row[4]||'').trim().replace(/[<>]/g,'');
        const mapsLink=(row[5]||'').trim().replace(/[<>"]/g,''), wa1=(row[6]||'').trim().replace(/[^0-9\+]/g,''), wa2=(row[7]||'').trim().replace(/[^0-9\+]/g,'');
        let imgUrl=(row[8]||'').trim(); const srcMatch = imgUrl.match(/src=["']([^"']+)["']/i); if(srcMatch) imgUrl=srcMatch[1]; imgUrl=imgUrl.replace(/[<>"]/g,'');
        const rating = (row[10]||'').trim(); // RATING IS COLUMN 11 (INDEX 10)

        const brandsList = brandsRaw.replace(/"/g,'').split(',').map(b=>b.trim()).filter(Boolean);
        let tagsHTML = rating ? `<span class="tag" style="background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.3);">⭐ ${rating}</span>` : '';
        tagsHTML += brandsList.slice(0,3).map(b=>`<span class="tag tag-brand">${b}</span>`).join('');
        if(brandsList.length>3) tagsHTML += `<span class="tag tag-more">+${brandsList.length-3} more<span class="tooltip">${brandsList.slice(3).join(', ')}</span></span>`;
        if(condition) tagsHTML += `<span class="tag ${condTagClass(condition)}">${condition}</span>`;

        const mediaHTML = imgUrl ? `<div class="card-media"><img src="${imgUrl}" alt="${shopName.replace(/"/g, '&quot;')}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('show-fallback')"></div>` : `<div class="card-media no-image"></div>`;
        const modelsRow = modelsRaw ? `<div class="meta-row"><svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>${modelsRaw.replace(/"/g,'').replace(/[<>]/g,'').split(',').join(', ')}</div>` : '';
        const mapsRow = mapsLink ? `<div class="meta-row map-link"><svg viewBox="0 0 24 24"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg><a href="${mapsLink}" target="_blank">View on Maps →</a></div>` : '';

        let waBtns = '';
        if(wa1 && wa2) waBtns = `<a href="https://wa.me/${wa1}?text=${WA_MSG}" target="_blank" class="wa-btn half">${waIconSVG(20)}<div>Contact 1</div></a><a href="https://wa.me/${wa2}?text=${WA_MSG}" target="_blank" class="wa-btn half">${waIconSVG(20)}<div>Contact 2</div></a>`;
        else if(wa1) waBtns = `<a href="https://wa.me/${wa1}?text=${WA_MSG}" target="_blank" class="wa-btn single">${waIconSVG(18)}<div>WhatsApp <span class="wa-subtext">Tap to message</span></div></a>`;

        return `<div class="card" style="animation-delay:${idx*0.05}s">${mediaHTML}<div class="card-body"><div class="card-title">${shopName}</div><div class="tags">${tagsHTML}</div>${modelsRow}<div class="meta-row"><svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${location}, UAE</div>${mapsRow}</div>${waBtns ? `<div class="btn-group">${waBtns}</div>` : ''}</div>`;
    }).join('');

    if (totalPages > 1) {
        html += `<div class="pagination"><button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button><span style="font-size: 13px; color: rgba(255,255,255,0.5); margin: 0 10px;">Page ${currentPage} of ${totalPages}</span><button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button></div>`;
    } c.innerHTML = html;
}

document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; applyFilters(); });
document.getElementById('openDrawer').addEventListener('click', () => { document.getElementById('drawerOverlay').classList.add('open'); document.body.style.overflow='hidden'; });
document.getElementById('closeDrawer').addEventListener('click', () => { document.getElementById('drawerOverlay').classList.remove('open'); document.body.style.overflow=''; });
</script>
</body>
</html>
