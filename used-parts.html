<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Used Spare Parts | ScrapCar.ae</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Geist:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Geist', sans-serif; }
        body { background-color: #FAFAFA; color: #212121; overflow-x: hidden; display: flex; flex-direction: column; min-height: 100vh; }

        /* Smaller Hero Wrapper for Internal Pages */
        .hero-wrapper {
            background: linear-gradient(135deg, #F00B51 0%, #7366FF 100%);
            padding-bottom: 40px; 
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 5%; width: 100%; }
        
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 38px; font-weight: 400; color: #FFFFFF; letter-spacing: 1.5px; text-transform: uppercase; text-decoration: none; }
        
        .hero { max-width: 850px; margin: 20px auto 0 auto; text-align: center; padding: 0 20px; }
        .hero h1 { font-size: 36px; font-weight: 800; color: #FFFFFF; margin-bottom: 10px; }
        .hero p { font-size: 16px; color: rgba(255, 255, 255, 0.9); }

        /* Data Grid Container */
        .grid-container {
            max-width: 1100px; margin: 40px auto; padding: 0 20px;
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px;
            flex-grow: 1; /* Pushes footer to bottom */
        }

        /* Listing Cards */
        .card {
            background: #FFFFFF; border-radius: 12px; padding: 24px;
            box-shadow: 0 2px 1px -1px rgba(0,0,0,0.05), 0 1px 1px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.05);
            border: 1px solid #E0E0E0; transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover {
            transform: translateY(-4px); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06); border-color: #BDBDBD;
        }
        .card h3 { font-size: 22px; font-weight: 600; color: #212121; margin-bottom: 16px; border-bottom: 2px solid #FAFAFA; padding-bottom: 10px; }
        .card p { font-size: 15px; color: #555; line-height: 1.6; margin-bottom: 8px; }
        .card strong { color: #212121; font-weight: 600; }

        /* Loader */
        .loader { text-align: center; font-size: 18px; color: #757575; grid-column: 1 / -1; padding: 40px; font-weight: 500; }

        /* Footer */
        footer {
            background-color: #111827; color: #FFFFFF; padding: 40px 5%; margin-top: auto;
        }
        .footer-content {
            max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 20px;
        }
        .footer-links { display: flex; gap: 24px; flex-wrap: wrap; }
        .footer-links a { color: #9CA3AF; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s; }
        .footer-links a:hover { color: #FFFFFF; }
        .footer-copyright { color: #6B7280; font-size: 14px; margin-top: 20px; text-align: center; width: 100%; border-top: 1px solid #374151; padding-top: 20px; }
    </style>
</head>
<body>

    <div class="hero-wrapper">
        <header>
            <a href="index.html" class="logo">SCRAPCAR.AE</a>
        </header>
        <section class="hero">
            <h1>Used Spare Parts Directory</h1>
            <p>Live listings fetched directly from our verified network.</p>
        </section>
    </div>

    <!-- This is where the Google Sheets data will appear -->
    <main class="grid-container" id="listings-container">
        <div class="loader">Fetching latest parts & yards... ⚙️</div>
    </main>

    <!-- New Footer -->
    <footer>
        <div class="footer-content">
            <div class="logo" style="font-size: 24px;">SCRAPCAR.AE</div>
            <div class="footer-links">
                <a href="#">About Us</a>
                <a href="#">Contact Us</a>
                <a href="#">Safety Center</a>
                <a href="#">Terms of Service</a>
                <a href="#">Privacy Policy</a>
            </div>
            <div class="footer-copyright">
                &copy; 2026 ScrapCar.ae. All rights reserved.
            </div>
        </div>
    </footer>

    <!-- Google Sheets CSV Fetch Logic -->
    <script>
        // Your exact Google Sheets CSV Link
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOZ5sGD1yMuSaFWNpHHAdRUdndQyeTOD6-xBuKq-A3wmEim82bPT5mcCfcyJPnLMz0PWgbO_VX1P-S/pub?output=csv';
        const container = document.getElementById('listings-container');

        fetch(csvUrl)
            .then(response => response.text())
            .then(data => {
                // Parse CSV rows
                const rows = data.split('\n').map(row => row.split(','));
                const headers = rows[0]; // First row is column titles
                const listings = rows.slice(1); // Rest are the actual shops/parts
                
                container.innerHTML = ''; // Clear the loader

                // Build a card for each row
                listings.forEach(row => {
                    if (row.length > 1 && row[0].trim() !== "") { // Skip empty rows
                        const card = document.createElement('div');
                        card.className = 'card';
                        
                        // Use the first column as the Title (e.g., Shop Name)
                        let cardHTML = `<h3>${row[0]}</h3>`;
                        
                        // Loop through the rest of the columns and display them
                        for (let i = 1; i < headers.length; i++) {
                            if (row[i] && row[i].trim() !== "") {
                                cardHTML += `<p><strong>${headers[i].trim()}:</strong> ${row[i].trim()}</p>`;
                            }
                        }
                        
                        card.innerHTML = cardHTML;
                        container.appendChild(card);
                    }
                });

                if (listings.length === 0) {
                    container.innerHTML = '<div class="loader">No listings available at the moment.</div>';
                }
            })
            .catch(error => {
                console.error('Error fetching data:', error);
                container.innerHTML = '<div class="loader" style="color: #F00B51;">Error loading listings. Please check your Google Sheet link.</div>';
            });
    </script>
</body>
</html>
