<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detailing | Pro1Stop.ae</title>
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#F00B51">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* ── CSS VARIABLES (LIGHT/DARK MODE) ── */
        :root[data-theme="dark"] {
            --bg-main: #0a0f1e; --bg-card: #111827; --bg-header: rgba(10,15,30,0.92);
            --text-main: #f1f5f9; --text-muted: rgba(255,255,255,0.45);
            --border-color: #1f2d45; --border-light: rgba(255,255,255,0.07);
            --bg-input: rgba(255,255,255,0.06); --btn-bg: rgba(255,255,255,0.07);
            --skeleton-base: #1f2d45; --skeleton-shine: #2d3f5e;
        }
        :root[data-theme="light"] {
            --bg-main: #f8fafc; --bg-card: #ffffff; --bg-header: rgba(255,255,255,0.92);
            --text-main: #0f172a; --text-muted: #64748b;
            --border-color: #e2e8f0; --border-light: rgba(0,0,0,0.1);
            --bg-input: rgba(0,0,0,0.04); --btn-bg: rgba(0,0,0,0.05);
            --skeleton-base: #e2e8f0; --skeleton-shine: #f1f5f9;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; overflow-x: hidden; transition: background 0.3s, color 0.3s; }

        header { position: sticky; top: 0; z-index: 100; background: var(--bg-header); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-light); padding: 0 32px; height: 64px; display: flex; align-items: center; gap: 16px; transition: background 0.3s; }
        .back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; background: var(--btn-bg); border: 1px solid var(--border-light); color: var(--text-main); font-size: 13px; font-weight: 600; text-decoration: none; cursor: pointer; white-space: nowrap; flex-shrink: 0; }
        .logo { font-family: 'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 2px; color: var(--text-main); text-decoration: none; flex-shrink: 0; }
        .logo span { color: #F00B51; }
        
        .search-wrap { flex: 1; max-width: 460px; margin-left: auto; display: flex; align-items: center; gap: 0; background: var(--bg-input); border: 1px solid var(--border-light); border-radius: 9px; padding: 0 14px; }
        .search-wrap:focus-within { border-color: rgba(240,11,81,0.5); box-shadow: 0 0 0 3px rgba(240,11,81,0.1); }
        .search-wrap svg { color: var(--text-muted); flex-shrink: 0; }
        #searchInput { flex: 1; background: none; border: none; outline: none; font-family: 'Inter', sans-serif; font-size: 13.5px; color: var(--text-main); padding: 11px 10px; }
        
        /* THEME TOGGLE */
        .theme-toggle { background: var(--btn-bg); border: 1px solid var(--border-light); color: var(--text-main); border-radius: 8px; padding: 8px; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; }

        .mobile-filter-btn { display: none; align-items: center; gap: 7px; padding: 9px 14px; background: var(--btn-bg); border: 1px solid var(--border-light); border-radius: 8px; color: var(--text-main); font-size: 13px; font-weight: 600; cursor: pointer; flex-shrink: 0; }

        .layout { display: flex; flex: 1; max-width: 1600px; margin: 0 auto; width: 100%; }

        .sidebar { width: 248px; flex-shrink: 0; border-right: 1px solid var(--border-light); padding: 28px 20px; position: sticky; top: 64px; height: calc(100vh - 64px); overflow-y: auto; }
        .sidebar::-webkit-scrollbar { width: 4px; } .sidebar::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 4px; }
        .filter-section { margin-bottom: 28px; padding-bottom: 20px; border-bottom: 1px solid var(--border-light); }
        .filter-title { font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.2px; color: var(--text-muted); margin-bottom: 14px; }
        .filter-scroll { max-height: 200px; overflow-y: auto; padding-right: 4px; }
        .filter-label { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 7px; cursor: pointer; font-size: 13.5px; font-weight: 500; color: var(--text-main); user-select: none; margin-bottom: 2px; }
        .filter-label:hover { background: var(--btn-bg); }
        .filter-label input[type="checkbox"] { width: 15px; height: 15px; accent-color: #F00B51; cursor: pointer; flex-shrink: 0; }
        .filter-count { margin-left: auto; font-size: 11px; font-weight: 700; background: var(--btn-bg); color: var(--text-muted); padding: 2px 7px; border-radius: 100px; }
        
        .sidebar-search { width: 100%; background: var(--bg-input); border: 1px solid var(--border-light); color: var(--text-main); padding: 8px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 10px; outline: none; }
        .clear-btn { margin-top: 20px; width: 100%; padding: 10px 14px; background: transparent; border: 1px solid var(--border-light); border-radius: 8px; font-size: 12.5px; font-weight: 700; color: var(--text-muted); cursor: pointer; }

        .listings-area { flex: 1; padding: 28px 28px 40px; }
        .listings-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; gap: 12px; }
        .results-count { display: flex; align-items: center; gap: 10px; }
        .count-num { font-size: 26px; font-weight: 800; color: var(--text-main); letter-spacing: -1px; }
        .count-label { font-size: 14px; color: var(--text-muted); font-weight: 500; }
        .count-dot { width: 8px; height: 8px; background: #4DEB85; border-radius: 50%; animation: pulse 2s infinite; }

        .active-pills { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 20px; }
        .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: rgba(240,11,81,0.15); border: 1px solid rgba(240,11,81,0.3); border-radius: 100px; font-size: 12px; font-weight: 600; color: #ff4d7d; cursor: pointer; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 20px; }

        .card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 14px; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; overflow: visible !important; animation: fadeUp 0.3s ease both; }
        .card:hover { transform: translateY(-4px); box-shadow: 0 16px 40px rgba(0,0,0,0.15); border-color: rgba(240,11,81,0.25); }
        .card-media { height: 160px; border-radius: 14px 14px 0 0; overflow: hidden; border-bottom: 1px solid var(--border-color); position: relative; background: var(--bg-input); }
        .card-media img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-body { padding: 16px 16px 8px; display: flex; flex-direction: column; flex-grow: 1; }
        .card-title { font-size: 15px; font-weight: 800; color: var(--text-main); margin-bottom: 12px; line-height: 1.3; }

        .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
        .tag { padding: 3px 9px; border-radius: 6px; font-size: 11px; font-weight: 700; }
        .tag-brand { background: var(--btn-bg); color: var(--text-muted); border: 1px solid var(--border-light); }
        .tag-used  { background: rgba(240,11,81,0.12); color: #ff6b8a; border: 1px solid rgba(240,11,81,0.2); }
        .tag-new   { background: rgba(115,102,255,0.12); color: #818cf8; border: 1px solid rgba(115,102,255,0.2); }
        .tag-more { position: relative; cursor: pointer; background: var(--btn-bg); color: var(--text-muted); border: 1px solid var(--border-light); }
        .tag-more .tooltip { display: none; position: absolute; z-index: 99999; background: #1e2d47; color: #fff; font-size: 12px; padding: 8px 12px; border-radius: 8px; white-space: normal; min-width: 180px; text-align: center; bottom: 130%; left: 50%; transform: translateX(-50%); box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        .tag-more:hover .tooltip { display: block; }

        .meta-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-muted); margin-bottom: 8px; font-weight: 500; }
        .meta-row svg { width: 13px; height: 13px; fill: currentColor; flex-shrink: 0; }
        .map-link { color: #3b82f6; font-weight: 700; margin-bottom: 14px; }
        .map-link a { color: inherit; text-decoration: none; }

        .btn-group { display: flex; gap: 8px; margin-top: auto; padding: 12px 16px 14px; border-top: 1px solid var(--border-light); }
        .action-btn { flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px; transition: 0.15s; cursor: pointer; border: none; }
        .wa-btn { background: #25D366; color: #fff; flex: 2; }
        .wa-btn:hover { background: #1cb955; }
        .call-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-light); }
        .call-btn:hover { background: rgba(59, 130, 246, 0.1); color: #3b82f6; border-color: #3b82f6; }
        .share-btn { background: var(--btn-bg); color: var(--text-main); border: 1px solid var(--border-light); flex: 0.5; }
        .share-btn:hover { background: var(--border-color); }

        /* SKELETON LOADERS */
        .skeleton { animation: shimmer 1.5s infinite linear; background: linear-gradient(90deg, var(--skeleton-base) 0px, var(--skeleton-shine) 50%, var(--skeleton-base) 100%); background-size: 200% 100%; border-radius: 8px; }
        .skel-img { height: 160px; border-radius: 14px 14px 0 0; }
        .skel-text { height: 14px; margin-bottom: 10px; width: 80%; }
        .skel-text.short { width: 50%; }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        /* PAGINATION & BACK TO TOP */
        .pagination { display: flex; justify-content: center; align-items: center; gap: 8px; margin-top: 40px; grid-column: 1 / -1; }
        .page-btn { background: var(--btn-bg); border: 1px solid var(--border-light); color: var(--text-main); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .page-btn:hover:not(:disabled) { background: var(--border-color); }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        
        #bttBtn { display: none; position: fixed; bottom: 30px; right: 30px; z-index: 99; font-size: 24px; border: none; outline: none; background-color: #F00B51; color: white; cursor: pointer; padding: 10px 15px; border-radius: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: 0.3s; }
        #bttBtn:hover { background-color: #c2003f; transform: translateY(-3px); }

        /* FOOTER & MOBILE DRAWER */
        footer { background: var(--bg-header); border-top: 1px solid var(--border-light); padding: 32px 5%; margin-top: auto; }
        .footer-content { max-width: 1600px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 20px; }
        .footer-logo { font-family: 'Bebas Neue',sans-serif; font-size: 22px; letter-spacing: 2px; color: var(--text-muted); }
        .footer-logo span { color: #F00B51; }
        .footer-links { display: flex; gap: 20px; flex-wrap: wrap; }
        .footer-links a { color: var(--text-muted); text-decoration: none; font-size: 13px; font-weight: 500; }
        .drawer-overlay { display: none; position: fixed; inset: 0; z-index: 300; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); }
        .drawer-panel { position: absolute; top: 0; left: 0; width: 280px; height: 100%; background: var(--bg-card); padding: 24px 20px; overflow-y: auto; border-right: 1px solid var(--border-light); }
        .drawer-overlay.open { display: flex; }

        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(1.25)} }
        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        @media (max-width: 960px) { .layout { flex-direction: column; } .sidebar { display: none; width: 100%; position: static; height: auto; } .mobile-filter-btn { display: flex; } .listings-area { padding: 20px; } }
        @media (max-width: 640px) { header { padding: 0 16px; gap: 10px; } .logo { display: none; } .search-wrap { max-width: 100%; flex: 1; } .grid { grid-template-columns: 1fr; } #bttBtn { bottom: 20px; right: 20px; } }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="back-btn">← Back</a>
    <a href="index.html" class="logo">PRO<span>1STOP</span>.AE</a>
    <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="Search by car model, brand, or shop...">
    </div>
    <button class="theme-toggle" id="themeToggle" title="Toggle Dark/Light Mode">🌓</button>
    <button class="mobile-filter-btn" id="openDrawer">Filters</button>
</header>

<div class="layout">
    <aside class="sidebar" id="sidebar-desktop"></aside>

    <section class="listings-area">
        <div class="listings-header">
            <div class="results-count"><span class="count-dot"></span><span class="count-num" id="resultsNum">—</span><span class="count-label">Verified Providers</span></div>
        </div>
        <div class="active-pills" id="activePills"></div>
        <div class="grid" id="listings-container">
            <!-- SKELETON CARDS INITIALLY -->
        </div>
    </section>
</div>

<div class="drawer-overlay" id="drawerOverlay"><div class="drawer-panel"><div class="drawer-top"><span style="font-weight:bold;">Filters</span><button class="drawer-close" id="closeDrawer" style="background:none;border:none;color:var(--text-main);font-size:20px;">✕</button></div><div id="sidebar-mobile"></div></div></div>

<button id="bttBtn" title="Go to top">↑</button>

<footer>
    <div class="footer-content">
        <div class="footer-logo">PRO<span>1STOP</span>.AE</div>
        <div class="footer-links">
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="safety.html">Safety Center</a>
        </div>
        <div style="color:var(--text-muted); font-size:12px;">&copy; 2026 Pro1Stop.ae. All rights reserved.</div>
    </div>
</footer>

<script>
// ── THEME INITIALIZATION ──
const themeToggle = document.getElementById('themeToggle');
const currentTheme = localStorage.getItem('theme') || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
document.documentElement.setAttribute('data-theme', currentTheme);
themeToggle.addEventListener('click', () => { let theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; document.documentElement.setAttribute('data-theme', theme); localStorage.setItem('theme', theme); });

// CHANGE THIS LINK FOR EACH SERVICE PAGE!
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQOZ5sGD1yMuSaFWNpHHAdRUdndQyeTOD6-xBuKq-A3wmEim82bPT5mcCfcyJPnLMz0PWgbO_VX1P-S/pub?gid=1728844285&single=true&output=csv';
const WA_MSG = encodeURIComponent("Hi, I found your shop on Pro1Stop.ae! Can I get some info?");
const ITEMS_PER_PAGE = 12;

let allListings = [], filteredListings = []; let activeFilters = { location: [] }; let dynamicLocations = []; let currentPage = 1;

function renderSkeletons() { let html = ''; for(let i=0; i<8; i++) { html += `<div class="card"><div class="skeleton skel-img"></div><div class="card-body"><div class="skeleton skel-text"></div><div class="skeleton skel-text short"></div><div class="skeleton skel-text"></div></div></div>`; } document.getElementById('listings-container').innerHTML = html; }
renderSkeletons();

function parseCSV(text) { let p='', row=[''], ret=[row], i=0, r=0, s=true, l; for (l of text) { if ('"'===l) { if (s && l===p) row[i]+=l; s=!s; } else if (','===l && s) l=row[++i]=''; else if ('\n'===l && s) { if ('\r'===p) row[i]=row[i].slice(0,-1); row=ret[++r]=[l='']; i=0; } else row[i]+=l; p=l; } return ret; }

fetch(CSV_URL + '&t=' + Date.now()).then(r => r.text()).then(data => {
    const rows = parseCSV(data); allListings = rows.slice(1).filter(r => r.length > 3 && r[0] && r[0].trim());
    const lSet = new Set(); allListings.forEach(row => { if (row[1] && row[1].trim()) lSet.add(row[1].trim()); }); dynamicLocations = [...lSet].sort();
    buildSidebars(); applyFilters();
}).catch(() => { document.getElementById('listings-container').innerHTML = '<div style="text-align:center; grid-column:1/-1; padding:40px;">Error loading directory.</div>'; });

function buildSidebarHTML() {
    const locHTML = dynamicLocations.map(l => `<label class="filter-label"><input type="checkbox" class="filter-cb" value="${l.toLowerCase()}" ${activeFilters.location.includes(l.toLowerCase())?'checked':''} onchange="onCheck('location','${l.toLowerCase()}',this.checked)">${l}</label>`).join('');
    return `<div class="filter-section"><div class="filter-title">Location</div><div class="filter-scroll">${locHTML}</div></div><button class="clear-btn" onclick="clearFilters()">Clear Filters</button>`;
}
function buildSidebars() { const h = buildSidebarHTML(); document.getElementById('sidebar-desktop').innerHTML = h; document.getElementById('sidebar-mobile').innerHTML = h; }
function onCheck(k, v, c) { if (c) { if (!activeFilters[k].includes(v)) activeFilters[k].push(v); } else { activeFilters[k] = activeFilters[k].filter(x => x !== v); } currentPage = 1; buildSidebars(); applyFilters(); }
function clearFilters() { activeFilters = { location:[] }; document.getElementById('searchInput').value = ''; currentPage = 1; buildSidebars(); applyFilters(); }
function removePill(k, v) { activeFilters[k] = activeFilters[k].filter(x=>x!==v); currentPage = 1; buildSidebars(); applyFilters(); }

function applyFilters() {
    const q = document.getElementById('searchInput').value.toLowerCase().trim(); const { location } = activeFilters;
    filteredListings = allListings.filter(row => {
        const name = (row[0]||'').toLowerCase(), loc = (row[1]||'').toLowerCase();
        if (q && !name.includes(q) && !loc.includes(q)) return false;
        if (location.length && !location.some(l => loc.includes(l))) return false; return true;
    });
    document.getElementById('resultsNum').textContent = filteredListings.length;
    document.getElementById('activePills').innerHTML = Object.entries(activeFilters).flatMap(([k, vals]) => vals.map(v => `<span class="pill" onclick="removePill('${k}','${v}')">${v} ×</span>`)).join('');
    renderListings();
}
function changePage(page) { currentPage = page; renderListings(); window.scrollTo({ top: 0, behavior: 'smooth' }); }

function shareCard(shopName) { if (navigator.share) { navigator.share({ title: shopName, text: `Check out ${shopName} on Pro1Stop!`, url: window.location.href }); } else { navigator.clipboard.writeText(`Check out ${shopName} on Pro1Stop! ${window.location.href}`); alert("Link copied to clipboard!"); } }

function renderListings() {
    const c = document.getElementById('listings-container');
    if (!filteredListings.length) { c.innerHTML = '<div style="text-align:center; grid-column:1/-1; color:var(--text-muted); padding:40px;">No shops match your criteria.</div>'; return; }
    
    const totalPages = Math.ceil(filteredListings.length / ITEMS_PER_PAGE);
    const paginatedData = filteredListings.slice((currentPage - 1) * ITEMS_PER_PAGE, currentPage * ITEMS_PER_PAGE);

    let html = paginatedData.map((row, idx) => {
        const shopName=(row[0]||'').trim().replace(/[<>]/g,''), location=(row[1]||'').trim().replace(/[<>]/g,''), mapsLink=(row[2]||'').trim().replace(/[<>"]/g,''), wa1=(row[3]||'').trim().replace(/[^0-9\+]/g,''), wa2=(row[4]||'').trim().replace(/[^0-9\+]/g,''), rating=(row[7]||'').trim();
        let imgUrl=(row[5]||'').trim(); const srcMatch = imgUrl.match(/src=["']([^"']+)["']/i); if(srcMatch) imgUrl=srcMatch[1]; imgUrl=imgUrl.replace(/[<>"]/g,'');

        let tagsHTML = rating ? `<div class="tags"><span class="tag" style="background: rgba(234,179,8,0.15); color: #facc15; border: 1px solid rgba(234,179,8,0.3);">⭐ ${rating}</span></div>` : '';
        const mediaHTML = imgUrl ? `<div class="card-media"><img src="${imgUrl}" alt="${shopName.replace(/"/g, '&quot;')}" loading="lazy" onerror="this.style.display='none';this.parentElement.classList.add('show-fallback')"></div>` : `<div class="card-media no-image"></div>`;
        const mapsRow = mapsLink ? `<div class="meta-row map-link"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M20.5 3l-.16.03L15 5.1 9 3 3.36 4.9c-.21.07-.36.25-.36.48V20.5c0 .28.22.5.5.5l.16-.03L9 18.9l6 2.1 5.64-1.9c.21-.07.36-.25.36-.48V3.5c0-.28-.22-.5-.5-.5zM15 19l-6-2.11V5l6 2.11V19z"/></svg><a href="${mapsLink}" target="_blank">View on Maps →</a></div>` : '';

        let waIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.665.592 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.099.824z"/></svg>`;
        let callIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>`;
        let shareIcon = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>`;
        
        let actionBtns = '';
        if (wa1) {
            actionBtns += `<a href="tel:${wa1}" class="action-btn call-btn" title="Call">${callIcon}</a>`;
            actionBtns += `<a href="https://wa.me/${wa1}?text=${WA_MSG}" target="_blank" class="action-btn wa-btn">${waIcon}</a>`;
            actionBtns += `<button onclick="shareCard('${shopName.replace(/'/g, "\\'")}')" class="action-btn share-btn" title="Share">${shareIcon}</button>`;
        }

        return `<div class="card" style="animation-delay:${idx*0.05}s">${mediaHTML}<div class="card-body"><div class="card-title">${shopName}</div>${tagsHTML}<div class="meta-row"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>${location}, UAE</div>${mapsRow}</div>${actionBtns ? `<div class="btn-group">${actionBtns}</div>` : ''}</div>`;
    }).join('');

    if (totalPages > 1) { html += `<div class="pagination"><button class="page-btn" onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>← Prev</button><span style="font-size: 13px; color: var(--text-muted); margin: 0 10px;">Page ${currentPage} of ${totalPages}</span><button class="page-btn" onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>Next →</button></div>`; } c.innerHTML = html;
}

let bttBtn = document.getElementById("bttBtn"); window.onscroll = function() { if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) { bttBtn.style.display = "block"; } else { bttBtn.style.display = "none"; } }; bttBtn.onclick = function() { window.scrollTo({ top: 0, behavior: 'smooth' }); };
document.getElementById('searchInput').addEventListener('input', () => { currentPage = 1; applyFilters(); });
document.getElementById('openDrawer').addEventListener('click', () => { document.getElementById('drawerOverlay').classList.add('open'); document.body.style.overflow='hidden'; });
document.getElementById('closeDrawer').addEventListener('click', () => { document.getElementById('drawerOverlay').classList.remove('open'); document.body.style.overflow=''; });
</script>
